name: manufacturing-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manufacturing_platform}
      POSTGRES_USER: ${POSTGRES_USER:-manufacturing_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup to generate deployment secrets}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gateway:
    image: python:3.12-alpine
    working_dir: /app
    command: ["python", "/app/server.py"]
    environment:
      PORT: 9002
      PLATFORM_CALLBACK_URL: http://backend:8000/api/machine/events
      MACHINE_EVENT_TOKEN: ${MACHINE_EVENT_TOKEN:?Run make setup to generate deployment secrets}
      SIMULATOR_OPERATION_SECONDS: ${SIMULATOR_OPERATION_SECONDS:-4}
    ports:
      - "${GATEWAY_PORT:-9002}:9002"
    volumes:
      - ./infra/machine-simulator/server.py:/app/server.py:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9002/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-manufacturing_platform}:${POSTGRES_PASSWORD:?Run make setup}@postgres:5432/${POSTGRES_DB:-manufacturing_platform}
      EVIDENCE_DIR: /data/evidence
      REFERENCE_IMAGE_DIR: /app/data/reference_images
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8082,http://127.0.0.1:8082}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      MACHINE_EVENT_TOKEN: ${MACHINE_EVENT_TOKEN:?Run make setup}
      ADMIN_INTEGRATION_TOKEN: ${ADMIN_INTEGRATION_TOKEN:?Run make setup}
      MACHINE_CALLBACK_URL: ${MACHINE_CALLBACK_URL:-http://backend:8000/api/machine/events}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      TELEMETRY_DATABASE_URL: ${TELEMETRY_DATABASE_URL:-}
      TELEMETRY_TIMEZONE: ${TELEMETRY_TIMEZONE:-Asia/Kolkata}
      TELEMETRY_POLL_SECONDS: ${TELEMETRY_POLL_SECONDS:-2}
    ports:
      - "${API_PORT:-8083}:8000"
    volumes:
      - platform-evidence-data:/data/evidence
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  platform-postgres-data:
  platform-evidence-data:
